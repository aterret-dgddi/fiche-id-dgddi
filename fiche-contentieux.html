<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dépenses CP par poste — fiches par structure</title>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
  :root {
    --bleu: #1351A8; --rouge: #C0392B; --vert: #008941; --orange: #D07B00;
    --gris1: #1A1A1A; --gris2: #444; --gris3: #888; --gris4: #F5F6F8;
    --bord: #DDE1E9; --rep: #1351A8;
    --font: 'Marianne', Arial, Helvetica, sans-serif;
    --badge-dg: #1A1A1A; --badge-di: #1351A8; --badge-dr: #27AE60; --badge-scn: #8E44AD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gris4); color: var(--gris1); font-size: 12px; }

  .page-header { background: var(--bleu); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .page-header h1 { font-size: 15px; font-weight: 700; }
  .page-header .subtitle { font-size: 11px; opacity: .8; margin-top: 2px; }
  .header-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  /* Sélecteur structure avec recherche (même principe que la fiche identité) */
  #selector-wrap { position: relative; width: 340px; max-width: 100%; }
  #sel-input { width: 100%; padding: 6px 30px 6px 10px; border: 2px solid transparent; border-radius: 5px; font-family: var(--font); font-size: 12px; font-weight: 600; background: #fff; color: var(--gris1); cursor: pointer; }
  #sel-input:focus, #sel-input.open { outline: none; border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
  #sel-chevron { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--gris3); pointer-events: none; transition: transform .2s; }
  #sel-input.open + #sel-chevron { transform: translateY(-50%) rotate(180deg); }
  #sel-dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 2px solid var(--bleu); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,20,70,.22); display: none; flex-direction: column; z-index: 300; color: var(--gris1); }
  #sel-dropdown.open { display: flex; }
  #sel-search-wrap { position: relative; padding: 8px; border-bottom: 1px solid var(--bord); }
  #sel-search-wrap .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--gris3); }
  #sel-search { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--bord); border-radius: 5px; font-family: var(--font); font-size: 12px; }
  #sel-search:focus { outline: none; border-color: var(--bleu); }
  #sel-list { overflow-y: auto; max-height: 360px; }
  .sel-group { padding: 6px 12px 3px; font-size: 10px; font-weight: 700; color: var(--gris3); background: var(--gris4); position: sticky; top: 0; }
  .sel-item { padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--gris4); }
  .sel-item:hover, .sel-item.hl { background: #E6ECF8; }
  .sel-item.active { background: var(--bleu); color: #fff; }
  .sel-item-main { font-weight: 600; font-size: 12px; }
  .sel-item-meta { font-size: 10.5px; color: var(--gris3); margin-top: 1px; }
  .sel-item.active .sel-item-meta { color: rgba(255,255,255,.8); }
  .sel-item mark { background: #FFE58A; color: inherit; padding: 0; border-radius: 2px; }
  .sel-item.active mark { background: rgba(255,255,255,.3); }
  .sel-empty { padding: 16px; text-align: center; color: var(--gris3); font-style: italic; }

  /* Sélecteur de poste */
  .poste-bar { background: #fff; border-bottom: 1px solid var(--bord); padding: 8px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; }
  .poste-bar .lbl { font-size: 11px; color: var(--gris3); }
  .poste-btn { font-family: var(--font); font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--bord); background: #fff; color: var(--gris2); cursor: pointer; }
  .poste-btn:hover { border-color: var(--bleu); color: var(--bleu); }
  .poste-btn.on { background: var(--bleu); border-color: var(--bleu); color: #fff; font-weight: 600; }
  .poste-btn:disabled { opacity: .4; cursor: not-allowed; border-color: var(--bord); color: var(--gris3); }

  .btn { font-family: var(--font); font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--bord); background: #fff; color: var(--bleu); cursor: pointer; }
  .btn:hover { background: #EEF3FB; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.primary { background: var(--bleu); color: #fff; border-color: var(--bleu); }
  .btn.primary:hover { background: #0F4290; }

  .main { padding: 16px 20px; max-width: 1100px; margin: 0 auto; }

  .card { background: #fff; border: 1px solid var(--bord); border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
  .fiche-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .fiche-head .sigle { font-size: 18px; font-weight: 700; }
  .fiche-head .nom { font-size: 12px; color: var(--gris2); }
  .badge { font-size: 10px; font-weight: 700; color: #fff; padding: 2px 7px; border-radius: 10px; }
  .badge.DG { background: var(--badge-dg); } .badge.DI { background: var(--badge-di); }
  .badge.DR { background: var(--badge-dr); } .badge.SCN { background: var(--badge-scn); }
  .badge.NAT { background: var(--rouge); }
  .perimetre { font-size: 11px; color: var(--gris3); font-style: italic; margin-bottom: 14px; }
  .warn { background: #FFF6E5; color: #8A5300; border-left: 3px solid var(--orange); padding: 7px 10px; border-radius: 0 4px 4px 0; font-size: 11px; margin-bottom: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { border-left: 3px solid var(--bleu); background: var(--gris4); padding: 8px 12px; border-radius: 0 4px 4px 0; }
  .kpi .v { font-size: 17px; font-weight: 700; }
  .kpi .l { font-size: 10.5px; color: var(--gris2); margin-top: 2px; }

  .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .section-title h2 { font-size: 13px; font-weight: 700; color: var(--gris2); }
  .toggle { display: flex; gap: 3px; background: var(--gris4); border-radius: 5px; padding: 2px; }
  .toggle button { border: none; background: transparent; color: var(--gris2); padding: 3px 9px; border-radius: 4px; font-size: 10.5px; font-weight: 500; cursor: pointer; font-family: var(--font); }
  .toggle button.on { background: var(--rep); color: #fff; }

  .chart-wrapper { position: relative; height: 300px; }
  .empty { text-align: center; padding: 30px; color: var(--gris3); font-style: italic; }

  .table-scroll { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
  table.data th { text-align: right; font-weight: 600; color: var(--gris2); background: var(--gris4); padding: 7px 8px; border-bottom: 1px solid var(--bord); }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #EEF0F4; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data tr.current td { font-weight: 700; color: var(--bleu); }
  table.data tr.foot td { font-style: italic; color: var(--gris2); border-top: 1px solid var(--bord); }
  table.data td.poids { color: var(--gris1); }
  table.data tr.current td.poids { color: var(--bleu); }
  .sub { font-size: 10px; color: var(--gris3); font-weight: 400; }
  .up { color: var(--rouge); } .down { color: var(--vert); }
  .note { font-size: 10.5px; color: var(--gris3); margin-top: 8px; line-height: 1.45; }

  .export-box { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .export-box .types { display: flex; gap: 12px; flex-wrap: wrap; }
  .export-box label { font-size: 11.5px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .export-box .sep { width: 1px; align-self: stretch; background: var(--bord); }
  .progress { font-size: 11px; color: var(--gris3); }
  .error { background: #FDECEA; color: var(--rouge); padding: 12px; border-radius: 4px; }
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1 id="page-title">Dépenses CP 2022-2026</h1>
    <div class="subtitle" id="page-subtitle">Consommation CP mensuelle (Budget_Mensuel), par structure</div>
  </div>
  <div class="header-controls">
    <div id="selector-wrap">
      <input type="text" id="sel-input" placeholder="Choisir une structure…" readonly onclick="toggleDropdown()" autocomplete="off">
      <span id="sel-chevron">▾</span>
      <div id="sel-dropdown">
        <div id="sel-search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="sel-search" placeholder="Rechercher par sigle, nom, région…" autocomplete="off"
                 oninput="renderDropdownList(this.value)" onkeydown="onSearchKey(event)">
        </div>
        <div id="sel-list"></div>
      </div>
    </div>
    <button class="btn" id="btn-pdf-one" onclick="exportPDFStructure(false)" title="PDF de la structure affichée, poste sélectionné">📄 PDF de la fiche</button>
    <button class="btn" id="btn-pdf-one-all" onclick="exportPDFStructure(true)" title="PDF de la structure affichée, une page par poste">📄 PDF 5 postes</button>
  </div>
</div>

<div class="poste-bar" id="poste-bar">
  <span class="lbl">Poste :</span>
</div>

<div class="main">
  <div id="loading" class="card empty">Chargement des données…</div>
  <div id="error" class="error" style="display:none;"></div>

  <div id="fiche" class="card" style="display:none;">
    <div class="fiche-head">
      <span class="sigle" id="f-sigle"></span>
      <span class="badge" id="f-badge"></span>
      <span class="nom" id="f-nom"></span>
    </div>
    <div class="perimetre" id="f-perimetre"></div>
    <div class="warn" id="f-warn" style="display:none;"></div>

    <div class="kpis" id="f-kpis"></div>

    <div class="section-title">
      <h2 id="f-chart-title">Consommation CP mensuelle</h2>
      <div class="toggle">
        <button id="mode-mensuel" onclick="setMode('mensuel')">Mensuel</button>
        <button id="mode-cumule" class="on" onclick="setMode('cumule')">Cumulé</button>
      </div>
    </div>
    <div id="f-chart-wrapper" class="chart-wrapper"><canvas id="chart-main"></canvas></div>
    <div id="f-chart-empty" class="empty" style="display:none;"></div>

    <div class="section-title" style="margin-top:20px;"><h2>Dépenses CP par année</h2></div>
    <div class="table-scroll" id="f-table"></div>
    <div class="note" id="f-note"></div>
  </div>

  <div class="card">
    <div class="section-title"><h2>Export PDF groupé (une fiche par structure)</h2></div>
    <div class="export-box">
      <div class="types">
        <label><input type="radio" name="export-postes" value="current" checked> Poste affiché</label>
        <label><input type="radio" name="export-postes" value="all"> Les 5 postes</label>
      </div>
      <div class="sep"></div>
      <div class="types">
        <label><input type="checkbox" class="type-cb" value="DG" checked> DG</label>
        <label><input type="checkbox" class="type-cb" value="DI" checked> DI</label>
        <label><input type="checkbox" class="type-cb" value="DR" checked> DR outre-mer</label>
        <label><input type="checkbox" class="type-cb" value="SCN" checked> SCN</label>
        <label><input type="checkbox" id="cb-national" checked> Fiche nationale</label>
        <label><input type="checkbox" id="cb-national-hors-dg" checked> Fiche nationale hors DG</label>
        <label><input type="checkbox" id="cb-synthese" checked> Tableau de synthèse</label>
        <label><input type="checkbox" id="cb-skip-empty" checked> Ignorer les structures sans dépense</label>
      </div>
      <button class="btn primary" id="btn-pdf-all" onclick="exportPDFGroupe()">📚 Générer le PDF groupé</button>
      <span class="progress" id="pdf-progress"></span>
    </div>
  </div>
</div>

<script>
// ── Constantes ────────────────────────────────────────────────────────────────
const ANNEES = [2022, 2023, 2024, 2025, 2026];

/**
 * Postes disponibles dans le sélecteur (colonnes de Budget_Mensuel, CP).
 *  - kind 'mois'  : la colonne porte la consommation DU MOIS (Conso_*_CP) ;
 *  - kind 'cumul' : la colonne est un cumul depuis janvier précalculé dans Grist
 *                   (Cumul_CP_*) -> la consommation du mois est reconstruite par
 *                   différence (même règle que toIncrementalSerie du core).
 *  colLocal : part locale utilisée au numérateur du poids (sinon col, hors Siège).
 *  cible    : ligne cible « loyer annuel estimé » (table Immobilier), comme dans
 *             la fiche identité.
 */
const POSTES = {
  vehicules:   { label: 'Automobile',       titre: 'Dépenses automobiles',            kind: 'cumul', col: 'Cumul_CP_vehicules', colLocal: 'Cumul_CP_vehicules_local' },
  formation:   { label: 'Formation',        titre: 'Frais de formation',              kind: 'mois',  col: 'Conso_Formation_CP' },
  missions:    { label: 'Frais de mission', titre: 'Frais de mission (hors formation)', kind: 'mois', col: 'Conso_Missions_CP' },
  loyer:       { label: 'Loyer',            titre: 'Loyers',                          kind: 'mois',  col: 'Conso_Loyer_CP', cible: true },
  contentieux: { label: 'Contentieux',      titre: 'Frais de contentieux',            kind: 'mois',  col: 'Conso_Contx_CP' }
};
const POSTE_ORDER = ['vehicules', 'formation', 'missions', 'loyer', 'contentieux'];
const POSTE_DEFAUT = 'contentieux';

// Dépenses locales hors Immobilier et hors T6 Buralistes = Véhicules local + Fonctionnement local.
// Priorité aux cumuls précalculés côté Grist (même source que les graphiques de la fiche
// identité) ; à défaut, somme des consommations du mois.
const COLS_LOCAL_CUMUL = ['Cumul_CP_vehicules_local', 'Cumul_CP_fonctionnement_local'];
const COLS_LOCAL_MOIS  = ['Conso_CP_vehicules_local', 'Conso_CP_fonctionnement_local'];
const TYPES_AFFICHES = ['DG', 'DI_Hexagone', 'DI_Outremer', 'DR_Antilles', 'DR_Outremer', 'SCN'];
const MOIS_COURT = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
const MOIS_LONG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const FONT_CANVAS = 'Arial, Helvetica, sans-serif';
const COULEUR_CIBLE = '#B52020';

// ── État ──────────────────────────────────────────────────────────────────────
let STATE_structures = null;
let STATE_bm = null;
let STATE_immo = null;
let SIEGE_IDS = new Set();   // structures DG / Siège : pas d'enveloppe locale
let SKIP_ROW = null;         // lignes Budget_Mensuel ignorées (anti-doublon DI 972)
let LOCAL_MODE = null;       // 'cumul' | 'mois' | null (colonnes locales absentes)
let POSTE_DISPO = {};        // poste -> colonne présente dans Budget_Mensuel
let DEDUP_INFO = { di972Id: null, nbIgnorees: 0 };
let ENTITIES = [];           // [{key, sigle, nom, typeLabel, ids, perimetre}]
let currentKey = null;
let currentPoste = POSTE_DEFAUT;
let currentMode = 'cumule';  // 'mensuel' | 'cumule'
let chartInstance = null;
const FICHE_CACHE = new Map(); // `${entity.key}|${poste}` -> résultat de computeFiche

// ── Formatage ─────────────────────────────────────────────────────────────────
const fmtEuro = v => (v != null && !isNaN(v)) ? Math.round(v).toLocaleString('fr-FR') + ' €' : '—';
const fmtEuroK = v => {
  if (v == null || isNaN(v)) return '—';
  const abs = Math.abs(v);
  if (abs >= 100000) return (v / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' k€';
  if (abs >= 1000)   return (v / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k€';
  return Math.round(v).toLocaleString('fr-FR') + ' €';
};
const fmtEvol = v => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + (v * 100).toFixed(1).replace('.', ',') + ' %';
const fmtPoids = v => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(2).replace('.', ',') + ' %';
const evolClass = v => (v == null || !isFinite(v) || v === 0) ? '' : (v > 0 ? 'up' : 'down');
// jsPDF (helvetica) ne gère pas les espaces insécables de toLocaleString('fr-FR')
const pdfSafe = s => String(s).replace(/[    ]/g, ' ').replace(/[«»]/g, '"');
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeName = s => String(s).replace(/[^a-z0-9\-]+/gi, '_');

function pdfTimestamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}h${p(d.getMinutes())}`;
}
function dateFR() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`;
}

function typeLabel(ta) {
  if (ta === 'DG') return 'DG';
  if (ta === 'DI_Hexagone' || ta === 'DI_Outremer') return 'DI';
  if (ta === 'DR_Antilles' || ta === 'DR_Outremer') return 'DR';
  if (ta === 'SCN') return 'SCN';
  return '';
}
function sortOrder(tl) { return { NAT: -1, DG: 0, DI: 1, DR: 2, SCN: 3 }[tl] ?? 9; }

// Couleur par année : dégradé bleu clair -> bleu République (année la plus récente)
function yearColor(idx, total) {
  const dark = { r: 19, g: 81, b: 168 }, light = { r: 197, g: 216, b: 240 };
  const t = total > 1 ? idx / (total - 1) : 1;
  const c = k => Math.round(light[k] + (dark[k] - light[k]) * t);
  return `rgb(${c('r')}, ${c('g')}, ${c('b')})`;
}

// ── Périmètres ────────────────────────────────────────────────────────────────
/** DR rattachées à une DI. Cas spécial DI 972 : DR 971/972/973 (même règle que le core et Grist). */
function getDRRattachees(structureId) {
  const s = STATE_structures, list = [];
  const idx = s.id.indexOf(structureId);
  const sigle = idx !== -1 ? (s.Sigle?.[idx] || '').trim() : null;
  if (sigle === 'DI 972') {
    s.id.forEach((id, i) => { if (['DR 971', 'DR 972', 'DR 973'].includes((s.Sigle?.[i] || '').trim())) list.push(id); });
    return list;
  }
  s.id.forEach((id, i) => { if (s.Type[i] === 'DR' && s.Parent && s.Parent[i] === structureId) list.push(id); });
  return list;
}

/**
 * Anti-doublon DI 972 : DI 972 est un regroupement pur de DR 971/972/973. Si
 * Budget_Mensuel contient, pour un même (année, mois), à la fois une ligne
 * DI 972 et des lignes de ses DR, la ligne DI 972 est ignorée (le détail DR
 * prime). Une ligne DI 972 seule (sans DR ce mois-là) reste prise en compte.
 * Calculé une fois pour toutes : s'applique à tous les postes, à la fiche
 * DI 972 et aux fiches nationales.
 */
function buildSkipRows() {
  const s = STATE_structures, bm = STATE_bm;
  SKIP_ROW = new Uint8Array(bm.id.length);
  DEDUP_INFO = { di972Id: null, nbIgnorees: 0 };
  const i972 = s.id.findIndex((_, i) => (s.Sigle?.[i] || '').trim() === 'DI 972');
  if (i972 === -1) return;
  const di972 = s.id[i972];
  DEDUP_INFO.di972Id = di972;
  const drIds = new Set(getDRRattachees(di972));
  const moisAvecDR = new Set();
  bm.id.forEach((_, i) => { if (drIds.has(bm.Structure[i])) moisAvecDR.add(bm.Annee[i] + '|' + bm.Mois[i]); });
  bm.id.forEach((_, i) => {
    if (bm.Structure[i] === di972 && moisAvecDR.has(bm.Annee[i] + '|' + bm.Mois[i])) {
      SKIP_ROW[i] = 1;
      DEDUP_INFO.nbIgnorees++;
    }
  });
  if (DEDUP_INFO.nbIgnorees) console.warn(`[depenses-cp] ${DEDUP_INFO.nbIgnorees} ligne(s) DI 972 ignorée(s) : doublon avec DR 971/972/973`);
}

function buildEntities() {
  const s = STATE_structures;
  const sigleOf = id => { const i = s.id.indexOf(id); return i !== -1 ? (s.Sigle?.[i] || '').trim() : ''; };
  const dg = [], others = [];

  for (let i = 0; i < s.id.length; i++) {
    const ta = s.Type_Affichage?.[i];
    if (!TYPES_AFFICHES.includes(ta)) continue;
    const sigle = (s.Sigle?.[i] || '').trim();
    if (!sigle) continue;
    const id = s.id[i];
    const nom = s.Nom?.[i] || sigle;
    const tl = typeLabel(ta);
    if (tl === 'DG') { dg.push({ id, sigle, nom }); continue; }
    let ids = [id], perimetre = sigle;
    if (tl === 'DI') {
      const drs = getDRRattachees(id);
      ids = [id, ...drs];
      if (drs.length) perimetre = `${sigle} + DR rattachées (${drs.map(sigleOf).filter(Boolean).join(', ')})`;
    }
    others.push({ key: String(id), sigle, nom, typeLabel: tl, ids, perimetre, region: (s.Region?.[i] || '').trim() });
  }

  const list = [...others];
  // DG : une seule fiche consolidant toutes les entités de type d'affichage DG
  if (dg.length) {
    const main = dg.find(d => d.sigle === 'DGDDI') || dg[0];
    list.push({
      key: 'DG', sigle: dg.length > 1 ? 'DG' : main.sigle, nom: main.nom, typeLabel: 'DG',
      ids: dg.map(d => d.id),
      perimetre: dg.length > 1 ? `Consolidation ${dg.map(d => d.sigle).join(', ')}` : main.sigle
    });
  }

  list.sort((a, b) => sortOrder(a.typeLabel) - sortOrder(b.typeLabel)
    || a.sigle.localeCompare(b.sigle, 'fr', { numeric: true }));

  // Fiches nationales : toutes les structures présentes dans Budget_Mensuel,
  // puis le même périmètre sans le DG (Siège + entités d'affichage DG).
  // Chaque structure n'est comptée qu'une fois (ids uniques).
  const allIds = [...new Set(STATE_bm.Structure)];
  const horsDgIds = allIds.filter(id => !SIEGE_IDS.has(id));
  list.unshift(
    { key: 'national', sigle: 'National', nom: 'Ensemble des structures', typeLabel: 'NAT', ids: allIds, perimetre: 'Toutes structures confondues' },
    { key: 'national_hors_dg', sigle: 'National hors DG', nom: 'DI, DR outre-mer et SCN', typeLabel: 'NAT', ids: horsDgIds, perimetre: 'Toutes structures sauf DG (Siège)' }
  );
  return list;
}

// ── Calculs ───────────────────────────────────────────────────────────────────
/** Série cumulée -> consommation du mois (différence avec le mois précédent). */
function toIncremental(cum) {
  return cum.map((v, i) => {
    if (v == null) return null;
    const prev = i === 0 ? 0 : cum[i - 1];
    return prev == null ? null : v - prev;
  });
}

function toCumulative(serie) {
  const out = []; let sum = 0, broken = false;
  serie.forEach(v => {
    if (broken || v == null) { out.push(null); broken = true; return; }
    sum += v; out.push(Math.round(sum));
  });
  return out;
}

const sumTo = (arr, n) => arr.slice(0, n).reduce((acc, v) => acc + (v || 0), 0);

/**
 * Agrège Budget_Mensuel sur un périmètre (2022-2026), par année et mois, pour un poste :
 *  - series   : consommation CP du mois du poste, toutes structures du périmètre ;
 *  - numLoc   : consommation du mois du poste, hors Siège (part locale pour
 *               l'automobile) -> numérateur du poids ;
 *  - localCum : dépenses locales CP hors Immo / hors T6, cumul depuis janvier,
 *               hors Siège -> dénominateur du poids.
 * La série s'arrête net (null) au premier mois sans aucune ligne sur le périmètre,
 * même règle que la fiche identité.
 */
function computeSeries(ids, posteKey) {
  const P = POSTES[posteKey];
  const bm = STATE_bm, idsSet = new Set(ids);
  const colNum = (P.colLocal && bm[P.colLocal]) ? P.colLocal : P.col;
  const acc = {};
  bm.id.forEach((_, i) => {
    if (SKIP_ROW[i] || !idsSet.has(bm.Structure[i])) return;
    const a = Number(bm.Annee[i]), m = Number(bm.Mois[i]);
    if (!ANNEES.includes(a) || !m || m < 1 || m > 12) return;
    const cell = ((acc[a] = acc[a] || {})[m] = acc[a][m] || { v: 0, vLoc: 0, local: 0 });
    cell.v += Number(bm[P.col]?.[i]) || 0;
    if (!SIEGE_IDS.has(bm.Structure[i])) {
      cell.vLoc += Number(bm[colNum]?.[i]) || 0;
      if (LOCAL_MODE === 'cumul') cell.local += COLS_LOCAL_CUMUL.reduce((s, col) => s + (Number(bm[col]?.[i]) || 0), 0);
      else if (LOCAL_MODE === 'mois') cell.local += COLS_LOCAL_MOIS.reduce((s, col) => s + (Number(bm[col]?.[i]) || 0), 0);
    }
  });

  const series = {}, numLoc = {}, localCum = {};
  ANNEES.forEach(a => {
    if (!acc[a]) return;
    let s = Array(12).fill(null), nl = Array(12).fill(null);
    const lc = Array(12).fill(null);
    let runLocal = 0;
    for (let m = 1; m <= 12; m++) {
      const cell = acc[a][m];
      if (!cell) break;
      s[m - 1] = cell.v;
      nl[m - 1] = cell.vLoc;
      runLocal = LOCAL_MODE === 'cumul' ? cell.local : runLocal + cell.local;
      lc[m - 1] = runLocal;
    }
    if (P.kind === 'cumul') { s = toIncremental(s); nl = toIncremental(nl); }
    s = s.map(v => v == null ? null : Math.round(v));
    if (s.some(v => v != null)) { series[a] = s; numLoc[a] = nl; localCum[a] = lc; }
  });
  return { series, numLoc, localCum };
}

/** Tableau annuel : total, mois disponibles, évolutions, poids dans les dépenses locales. */
function computeAnnualTable(agg) {
  const { series, numLoc, localCum } = agg;
  const annees = ANNEES.filter(a => series[a]);
  if (!annees.length) return { hasData: false, rows: [], annees: [] };

  const last = annees[annees.length - 1];
  const moisRef = series[last].filter(v => v != null).length; // dernier mois disponible de l'année la plus récente

  const rows = ANNEES.map(a => {
    const s = series[a];
    if (!s) return { annee: a, hasData: false };
    const nbMois = s.filter(v => v != null).length;
    const total = sumTo(s, nbMois);
    const cumulRef = nbMois >= moisRef ? sumTo(s, moisRef) : null;
    // Poids = poste (hors Siège) / dépenses locales CP hors Immo et T6, à fin du dernier mois dispo
    const local = LOCAL_MODE ? localCum[a][nbMois - 1] : null;
    const num = sumTo(numLoc[a], nbMois);
    const poids = local > 0 ? num / local : null;
    return { annee: a, hasData: true, nbMois, total, complete: nbMois === 12, cumulRef, local, num, poids };
  });

  rows.forEach((r, i) => {
    if (!r.hasData || i === 0) return;
    const prev = rows[i - 1];
    if (!prev.hasData) return;
    if (r.complete && prev.complete && prev.total) r.evolAnnuelle = (r.total - prev.total) / Math.abs(prev.total);
    if (r.cumulRef != null && prev.cumulRef) r.evolPeriode = (r.cumulRef - prev.cumulRef) / Math.abs(prev.cumulRef);
  });

  const withData = rows.filter(r => r.hasData);
  const completes = withData.filter(r => r.complete);
  const moyenne = completes.length ? completes.reduce((acc, r) => acc + r.total, 0) / completes.length : null;
  const totalPeriode = withData.reduce((acc, r) => acc + r.total, 0);
  // Poids moyen sur la période : Σ poste ÷ Σ dépenses locales (pondéré, jamais une moyenne de taux)
  const sumLocal = withData.reduce((acc, r) => acc + (r.local || 0), 0);
  const sumNum = withData.reduce((acc, r) => acc + (r.local ? r.num : 0), 0);
  const poidsPeriode = sumLocal > 0 ? sumNum / sumLocal : null;

  return { hasData: true, rows, annees, last, moisRef, moyenne, nbCompletes: completes.length, totalPeriode, poidsPeriode };
}

/**
 * Loyer annuel estimé (table Immobilier, Loyer_Annuel), dédupliqué par site —
 * même règle que la fiche identité et le tableau de bord budget. National :
 * tous les sites ; national hors DG : sites hors Siège ; sinon : périmètre.
 */
function getLoyerAnnuel(entity) {
  const immo = STATE_immo;
  if (!immo || !immo.id || !immo.Loyer_Annuel) return null;
  const idsSet = new Set(entity.ids);
  const inScope = entity.key === 'national' ? () => true
    : entity.key === 'national_hors_dg' ? sid => !SIEGE_IDS.has(sid)
    : sid => idsSet.has(sid);
  const seen = new Set();
  let total = 0;
  for (let i = 0; i < immo.id.length; i++) {
    if (!inScope(immo.Structure?.[i])) continue;
    const siteKey = immo.site?.[i] || immo.Libelle?.[i] || String(immo.id[i]);
    if (seen.has(siteKey)) continue;
    seen.add(siteKey);
    total += Number(immo.Loyer_Annuel[i]) || 0;
  }
  return total > 0 ? total : null;
}

function isSiegeOnly(entity) { return entity.ids.length > 0 && entity.ids.every(id => SIEGE_IDS.has(id)); }

function computeFiche(entity, posteKey) {
  const k = entity.key + '|' + posteKey;
  if (FICHE_CACHE.has(k)) return FICHE_CACHE.get(k);
  const agg = computeSeries(entity.ids, posteKey);
  const res = {
    series: agg.series,
    table: computeAnnualTable(agg),
    loyerAnnuel: POSTES[posteKey].cible ? getLoyerAnnuel(entity) : null
  };
  FICHE_CACHE.set(k, res);
  return res;
}

function buildDatasets(fiche, mode, forPdf) {
  const { series, loyerAnnuel } = fiche;
  const annees = ANNEES.filter(a => series[a]);
  const ds = annees.map((a, idx) => {
    const color = yearColor(idx, annees.length);
    const isLast = idx === annees.length - 1;
    return {
      label: String(a),
      data: mode === 'cumule' ? toCumulative(series[a]) : series[a],
      borderColor: color, backgroundColor: color,
      borderWidth: forPdf ? (isLast ? 3.2 : 1.6) : (isLast ? 3 : 1.5),
      borderDash: isLast ? [] : (forPdf ? [5, 4] : [4, 3]),
      pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false
    };
  });
  if (loyerAnnuel) {
    const v = mode === 'cumule' ? loyerAnnuel : loyerAnnuel / 12;
    ds.push({
      label: mode === 'cumule' ? 'Loyer annuel estimé' : 'Moyenne mensuelle estimée',
      data: Array(12).fill(Math.round(v)),
      borderColor: COULEUR_CIBLE, backgroundColor: COULEUR_CIBLE,
      borderWidth: 2, borderDash: [2, 3], pointRadius: 0, tension: 0
    });
  }
  return ds;
}

/** Explication de l'absence de poids (DG, colonnes absentes). */
function poidsLabel(entity) {
  if (isSiegeOnly(entity)) return 'non applicable au DG (pas d\'enveloppe locale)';
  if (!LOCAL_MODE) return 'colonnes locales absentes de Budget_Mensuel';
  return null;
}

function buildWarn(entity) {
  const msgs = [];
  if (DEDUP_INFO.nbIgnorees && DEDUP_INFO.di972Id != null && entity.ids.includes(DEDUP_INFO.di972Id)) {
    msgs.push(`Anti-doublon : ${DEDUP_INFO.nbIgnorees} ligne(s) mensuelle(s) DI 972 ignorée(s) car les DR 971/972/973 sont déjà présentes pour les mêmes mois.`);
  }
  if (entity.key === 'national') {
    msgs.push('Le poids est calculé hors DG : le Siège n\'a pas d\'enveloppe locale.');
  }
  return msgs;
}

// ── Rendu écran ───────────────────────────────────────────────────────────────
function renderPosteBar() {
  const bar = document.getElementById('poste-bar');
  bar.innerHTML = '<span class="lbl">Poste :</span>' + POSTE_ORDER.map(k => {
    const P = POSTES[k];
    const dis = !POSTE_DISPO[k];
    return `<button class="poste-btn${k === currentPoste ? ' on' : ''}" ${dis ? 'disabled' : ''}
      title="${escapeHtml(dis ? `Colonne ${P.col} absente de Budget_Mensuel` : P.titre)}"
      onclick="setPoste('${k}')">${escapeHtml(P.label)}</button>`;
  }).join('');
}

function setPoste(k) {
  if (!POSTE_DISPO[k]) return;
  currentPoste = k;
  renderPosteBar();
  renderFiche();
}

// ── Sélecteur structure avec recherche ────────────────────────────────────────
const SEL_GROUPS = { NAT: 'National', DG: 'DG', DI: 'DI', DR: 'DR outre-mer', SCN: 'SCN' };
const normalize = str => String(str || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let selVisibleKeys = [];   // ordre des éléments affichés (navigation clavier)
let selHighlight = -1;

function entityLabel(e) { return e.nom && e.nom !== e.sigle && e.typeLabel !== 'NAT' ? `${e.sigle} — ${e.nom}` : e.sigle; }
function entityMeta(e) {
  if (e.typeLabel === 'NAT') return e.perimetre;
  return [SEL_GROUPS[e.typeLabel], e.region, e.perimetre !== e.sigle ? e.perimetre : ''].filter(Boolean).join(' • ');
}

/** Surligne chaque mot recherché (insensible à la casse et aux accents). */
function highlight(text, words) {
  const src = String(text || '');
  if (!words.length) return escapeHtml(src);
  const norm = normalize(src);           // même longueur que src (diacritiques retirés un par un)
  const marks = new Array(src.length).fill(false);
  words.forEach(w => { let i = norm.indexOf(w); while (i !== -1) { for (let k = i; k < i + w.length; k++) marks[k] = true; i = norm.indexOf(w, i + 1); } });
  let out = '', open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] && !open) { out += '<mark>'; open = true; }
    if (!marks[i] && open) { out += '</mark>'; open = false; }
    out += escapeHtml(src[i]);
  }
  return out + (open ? '</mark>' : '');
}

function toggleDropdown() {
  const dd = document.getElementById('sel-dropdown');
  if (dd.classList.contains('open')) { closeDropdown(); return; }
  dd.classList.add('open');
  document.getElementById('sel-input').classList.add('open');
  renderDropdownList('');
  const search = document.getElementById('sel-search');
  search.value = '';
  search.focus();
  const act = document.querySelector('#sel-list .sel-item.active');
  if (act) act.scrollIntoView({ block: 'nearest' });
}

function closeDropdown() {
  document.getElementById('sel-dropdown').classList.remove('open');
  document.getElementById('sel-input').classList.remove('open');
  document.getElementById('sel-search').value = '';
  selHighlight = -1;
}

/** Recherche multi-mots : chaque mot doit apparaître dans le sigle, le nom, la région, le type ou le périmètre. */
function renderDropdownList(term) {
  const list = document.getElementById('sel-list');
  const words = normalize(term).split(/\s+/).filter(Boolean);
  const matches = ENTITIES.filter(e => {
    if (!words.length) return true;
    const hay = normalize([e.sigle, e.nom, e.region, SEL_GROUPS[e.typeLabel], e.perimetre].join(' '));
    return words.every(w => hay.includes(w));
  });
  selVisibleKeys = matches.map(e => e.key);
  selHighlight = words.length && matches.length ? 0 : -1;

  if (!matches.length) { list.innerHTML = '<div class="sel-empty">Aucune structure trouvée</div>'; return; }
  let html = '';
  Object.keys(SEL_GROUPS).forEach(tl => {
    const grp = matches.filter(e => e.typeLabel === tl);
    if (!grp.length) return;
    html += `<div class="sel-group">${SEL_GROUPS[tl]} (${grp.length})</div>`;
    grp.forEach(e => {
      html += `<div class="sel-item${e.key === currentKey ? ' active' : ''}" data-key="${escapeHtml(e.key)}"
                    onmousedown="event.preventDefault(); chooseEntity(this.dataset.key)">
        <div class="sel-item-main">${highlight(entityLabel(e), words)}</div>
        <div class="sel-item-meta">${highlight(entityMeta(e), words)}</div></div>`;
    });
  });
  list.innerHTML = html;
  applyHighlight();
}

function applyHighlight() {
  document.querySelectorAll('#sel-list .sel-item').forEach(el => el.classList.remove('hl'));
  if (selHighlight < 0) return;
  const el = document.querySelector(`#sel-list .sel-item[data-key="${CSS.escape(selVisibleKeys[selHighlight])}"]`);
  if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'nearest' }); }
}

function onSearchKey(ev) {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (!selVisibleKeys.length) return;
    const d = ev.key === 'ArrowDown' ? 1 : -1;
    selHighlight = selHighlight < 0 ? (d > 0 ? 0 : selVisibleKeys.length - 1)
      : (selHighlight + d + selVisibleKeys.length) % selVisibleKeys.length;
    applyHighlight();
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    const k = selVisibleKeys[selHighlight >= 0 ? selHighlight : 0];
    if (k) chooseEntity(k);
  } else if (ev.key === 'Escape') {
    closeDropdown();
    document.getElementById('sel-input').focus();
  }
}

function chooseEntity(key) { closeDropdown(); selectEntity(key); }

function updateSelectorDisplay() {
  const e = ENTITIES.find(x => x.key === currentKey);
  document.getElementById('sel-input').value = e ? entityLabel(e) : '';
}

document.addEventListener('click', ev => {
  const wrap = document.getElementById('selector-wrap');
  if (wrap && !wrap.contains(ev.target)) closeDropdown();
});

function selectEntity(key) {
  currentKey = key;
  updateSelectorDisplay();
  renderFiche();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-mensuel').classList.toggle('on', mode === 'mensuel');
  document.getElementById('mode-cumule').classList.toggle('on', mode === 'cumule');
  renderFiche();
}

function chartTitle(posteKey) {
  return currentMode === 'cumule' ? 'Consommation CP cumulée depuis janvier' : 'Consommation CP mensuelle';
}

function renderFiche() {
  const e = ENTITIES.find(x => x.key === currentKey);
  if (!e) return;
  const P = POSTES[currentPoste];
  const fiche = computeFiche(e, currentPoste);
  const { table } = fiche;

  document.getElementById('page-title').textContent = `${P.titre} — dépenses CP ${ANNEES[0]}-${ANNEES[ANNEES.length - 1]}`;
  document.getElementById('page-subtitle').textContent = `Consommation CP (Budget_Mensuel · ${P.col}), par structure`;

  document.getElementById('fiche').style.display = '';
  document.getElementById('f-sigle').textContent = e.sigle;
  const badge = document.getElementById('f-badge');
  badge.className = 'badge ' + e.typeLabel;
  badge.textContent = e.typeLabel === 'NAT' ? 'National' : e.typeLabel;
  document.getElementById('f-nom').textContent = e.nom !== e.sigle ? e.nom : '';
  document.getElementById('f-perimetre').textContent = 'Périmètre : ' + e.perimetre;
  const warns = buildWarn(e);
  const warnEl = document.getElementById('f-warn');
  warnEl.style.display = warns.length ? '' : 'none';
  warnEl.innerHTML = warns.map(escapeHtml).join('<br>');
  document.getElementById('f-chart-title').textContent = `${P.titre} — ${chartTitle().charAt(0).toLowerCase() + chartTitle().slice(1)}`;
  document.getElementById('f-chart-empty').textContent = `⚠️ Aucune dépense « ${P.label.toLowerCase()} » enregistrée pour ce périmètre sur ${ANNEES[0]}-${ANNEES[ANNEES.length - 1]}`;

  renderKPIs(e, fiche);
  renderChart(fiche);
  document.getElementById('f-table').innerHTML = buildTableHTML(e, table);
  document.getElementById('f-note').innerHTML = escapeHtml(buildNote(e, table, currentPoste));
}

function kpiList(entity, fiche) {
  const t = fiche.table;
  const last = t.rows.find(r => r.annee === t.last);
  const prev = t.rows.find(r => r.annee === t.last - 1);
  const lastComplete = [...t.rows].reverse().find(r => r.hasData && r.complete);
  const moisTxt = MOIS_LONG[t.moisRef - 1];
  const tiles = [{ v: fmtEuro(last.total), l: `${t.last} — cumul à fin ${moisTxt}` }];
  if (prev && prev.hasData && prev.cumulRef != null) {
    tiles.push({ v: fmtEvol(last.evolPeriode), l: `vs ${t.last - 1} à même période (${fmtEuro(prev.cumulRef)})`, evol: last.evolPeriode });
  }
  if (!poidsLabel(entity) && last.poids != null) {
    tiles.push({ v: fmtPoids(last.poids), l: `Poids ${t.last} dans les dépenses locales (${fmtEuro(last.local)})` });
  }
  if (fiche.loyerAnnuel) {
    tiles.push({ v: fmtEuro(fiche.loyerAnnuel), l: 'Loyer annuel estimé (Immobilier)' });
  } else if (lastComplete && lastComplete.annee !== t.last) {
    tiles.push({ v: fmtEuro(lastComplete.total), l: `Dépenses ${lastComplete.annee} (année complète)` });
  } else if (t.moyenne != null) {
    tiles.push({ v: fmtEuro(t.moyenne), l: `Moyenne annuelle (${t.nbCompletes} année${t.nbCompletes > 1 ? 's' : ''} complète${t.nbCompletes > 1 ? 's' : ''})` });
  }
  return tiles;
}

function renderKPIs(entity, fiche) {
  const el = document.getElementById('f-kpis');
  if (!fiche.table.hasData) { el.innerHTML = ''; return; }
  el.innerHTML = kpiList(entity, fiche).map(k =>
    `<div class="kpi"><div class="v ${k.evol !== undefined ? evolClass(k.evol) : ''}">${escapeHtml(k.v)}</div><div class="l">${escapeHtml(k.l)}</div></div>`).join('');
}

function renderChart(fiche) {
  const canvas = document.getElementById('chart-main');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const wrapper = document.getElementById('f-chart-wrapper');
  const empty = document.getElementById('f-chart-empty');
  if (!fiche.table.hasData) { wrapper.style.display = 'none'; empty.style.display = ''; return; }
  wrapper.style.display = ''; empty.style.display = 'none';

  chartInstance = new Chart(canvas, {
    type: 'line',
    data: { labels: MOIS_COURT, datasets: buildDatasets(fiche, currentMode, false) },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label} : ${fmtEuro(ctx.parsed.y)}` } }
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => fmtEuroK(v), color: '#8A9BAA', font: { size: 10 } }, grid: { color: '#e1e0d9' } },
        x: { ticks: { color: '#8A9BAA', font: { size: 10 }, autoSkip: false }, grid: { display: false } }
      }
    }
  });
}

function buildTableHTML(entity, t) {
  if (!t.hasData) return '<div class="empty">Aucune donnée</div>';
  const moisTxt = MOIS_COURT[t.moisRef - 1].toLowerCase();
  const noPoids = poidsLabel(entity);
  let html = `<table class="data"><thead><tr>
    <th>Année</th><th>Mois disponibles</th><th>Dépenses CP</th><th>Évol. vs N-1</th>
    <th>Cumul jan.–${moisTxt}</th><th>Évol. même période</th>
    <th>Poids dans les dépenses locales<br><span class="sub">hors Immobilier et T6</span></th></tr></thead><tbody>`;
  t.rows.forEach(r => {
    if (!r.hasData) {
      html += `<tr><td>${r.annee}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
      return;
    }
    const periode = r.complete ? '12 / 12' : `${r.nbMois} / 12 (fin ${MOIS_COURT[r.nbMois - 1].toLowerCase()}.)`;
    const poidsCell = noPoids ? '—'
      : `${fmtPoids(r.poids)}${r.local ? `<br><span class="sub">sur ${fmtEuro(r.local)}</span>` : ''}`;
    html += `<tr class="${r.annee === t.last ? 'current' : ''}">
      <td>${r.annee}</td><td>${periode}</td><td>${fmtEuro(r.total)}</td>
      <td class="${evolClass(r.evolAnnuelle)}">${fmtEvol(r.evolAnnuelle)}</td>
      <td>${fmtEuro(r.cumulRef)}</td>
      <td class="${evolClass(r.evolPeriode)}">${fmtEvol(r.evolPeriode)}</td>
      <td class="poids">${poidsCell}</td></tr>`;
  });
  html += `<tr class="foot"><td>Total ${ANNEES[0]}–${ANNEES[ANNEES.length - 1]}</td><td></td><td>${fmtEuro(t.totalPeriode)}</td><td></td><td></td><td></td><td>${noPoids ? '—' : fmtPoids(t.poidsPeriode)}</td></tr>`;
  if (t.moyenne != null) html += `<tr class="foot"><td>Moyenne années complètes</td><td></td><td>${fmtEuro(t.moyenne)}</td><td></td><td></td><td></td><td></td></tr>`;
  return html + '</tbody></table>';
}

function buildNote(entity, t, posteKey) {
  if (!t.hasData) return '';
  const P = POSTES[posteKey];
  const noPoids = poidsLabel(entity);
  const src = LOCAL_MODE === 'cumul' ? 'Cumul_CP_vehicules_local + Cumul_CP_fonctionnement_local' : 'Conso_CP_vehicules_local + Conso_CP_fonctionnement_local';
  const numTxt = (P.colLocal && STATE_bm[P.colLocal]) ? `part locale du poste (${P.colLocal})` : 'dépenses du poste';
  let note = `L'évolution annuelle n'est calculée qu'entre deux années complètes. La colonne « même période » compare le cumul de janvier à fin ${MOIS_LONG[t.moisRef - 1]} (dernier mois disponible en ${t.last}) d'une année sur l'autre. Hausse en rouge, baisse en vert. `;
  note += noPoids
    ? `Poids : ${noPoids}.`
    : `Poids = ${numTxt} hors Siège ÷ dépenses CP locales hors Immobilier et hors T6 Buralistes (${src}), à fin du dernier mois disponible de chaque année ; ligne Total = Σ poste ÷ Σ dépenses locales.`;
  if (P.kind === 'cumul') note += ` Consommation du mois reconstruite par différence entre deux cumuls successifs (${P.col}) : une régularisation peut donner un mois négatif.`;
  else note += ' Poste informatif déjà inclus dans Fonctionnement.';
  if (P.cible) note += ' Ligne rouge : loyer annuel estimé (table Immobilier, dédupliqué par site) — montant annuel en vue cumulée, moyenne mensuelle (÷ 12) en vue mensuelle.';
  return note;
}

// ── Export PDF ────────────────────────────────────────────────────────────────
/** Graphique hors écran -> JPEG compressé, fond blanc, police système. */
async function renderChartImage(fiche) {
  // 1000 px sur 182 mm ≈ 140 dpi : net à l'impression, ~20x plus léger qu'un PNG 1600 px
  const W = 1000, H = 450;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  canvas.style.cssText = 'position:fixed;left:-99999px;top:0;';
  document.body.appendChild(canvas);
  const whiteBg = { id: 'whiteBg', beforeDraw: c => { const x = c.ctx; x.save(); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.restore(); } };
  const chart = new Chart(canvas, {
    type: 'line',
    data: { labels: MOIS_COURT, datasets: buildDatasets(fiche, currentMode, true) },
    options: {
      responsive: false, animation: false, devicePixelRatio: 1,
      font: { family: FONT_CANVAS },
      plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 14, family: FONT_CANVAS }, boxWidth: 20, padding: 16 } }, tooltip: { enabled: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => fmtEuroK(v), color: '#6B7785', font: { size: 13, family: FONT_CANVAS } }, grid: { color: '#e1e0d9' } },
        x: { ticks: { color: '#6B7785', font: { size: 13, family: FONT_CANVAS }, autoSkip: false }, grid: { display: false } }
      }
    },
    plugins: [whiteBg]
  });
  await new Promise(r => setTimeout(r, 20));
  // JPEG (fond blanc déjà peint) : un PNG non compressé pesait ~1,5 Mo par graphique
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  chart.destroy(); canvas.remove();
  return { dataUrl, ratio: H / W };
}

const PDF = { W: 210, H: 297, M: 14, BLEU: [19, 81, 168], ROUGE: [192, 57, 43], VERT: [0, 137, 65], GRIS: [90, 90, 90] };

function pdfHeader(pdf, title, subtitle) {
  pdf.setFillColor(...PDF.BLEU);
  pdf.rect(0, 0, PDF.W, 24, 'F');
  pdf.setTextColor(255, 255, 255);
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14);
  pdf.text(pdfSafe(title), PDF.M, 11);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9);
  pdf.text(pdfSafe(subtitle), PDF.M, 18);
}

function pdfFooters(pdf) {
  const n = pdf.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    pdf.setPage(p);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7); pdf.setTextColor(140, 140, 140);
    pdf.text(pdfSafe(`DGDDI — Dépenses CP par poste (Budget_Mensuel) — édité le ${dateFR()}`), PDF.M, PDF.H - 8);
    pdf.text(`${p} / ${n}`, PDF.W - PDF.M, PDF.H - 8, { align: 'right' });
  }
}

function pdfParagraph(pdf, text, y, opts = {}) {
  pdf.setFont('helvetica', opts.style || 'italic'); pdf.setFontSize(opts.size || 7);
  pdf.setTextColor(...(opts.color || [140, 140, 140]));
  pdf.splitTextToSize(pdfSafe(text), PDF.W - 2 * PDF.M).forEach(l => { if (y < PDF.H - 13) { pdf.text(l, PDF.M, y); y += (opts.lh || 3.4); } });
  return y;
}

/** Dessine une fiche structure × poste complète sur la page courante. */
async function pdfDrawFiche(pdf, entity, posteKey) {
  const P = POSTES[posteKey];
  const fiche = computeFiche(entity, posteKey);
  const t = fiche.table;
  const typeTxt = entity.typeLabel === 'NAT' ? 'National' : entity.typeLabel;
  pdfHeader(pdf, `${P.titre} — ${entity.sigle}`, `${typeTxt}${entity.nom && entity.nom !== entity.sigle ? ' · ' + entity.nom : ''} · Dépenses CP ${ANNEES[0]}-${ANNEES[ANNEES.length - 1]}`);

  let y = 31;
  y = pdfParagraph(pdf, 'Périmètre : ' + entity.perimetre, y, { size: 8, lh: 3.8, color: [120, 120, 120] });
  buildWarn(entity).forEach(w => { y = pdfParagraph(pdf, w, y, { size: 7.5, lh: 3.6, color: [138, 83, 0] }); });
  y += 2;

  if (!t.hasData) {
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(...PDF.GRIS);
    pdf.text(pdfSafe(`Aucune dépense "${P.label.toLowerCase()}" enregistrée sur la période.`), PDF.M, y + 6);
    return;
  }

  // KPI
  const kpis = kpiList(entity, fiche);
  const kw = (PDF.W - 2 * PDF.M - (kpis.length - 1) * 3) / kpis.length;
  kpis.forEach((k, i) => {
    const x = PDF.M + i * (kw + 3);
    pdf.setFillColor(245, 246, 248); pdf.rect(x, y, kw, 16, 'F');
    pdf.setFillColor(...PDF.BLEU); pdf.rect(x, y, 0.9, 16, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11.5);
    pdf.setTextColor(...(k.evol > 0 ? PDF.ROUGE : k.evol < 0 ? PDF.VERT : [26, 26, 26]));
    pdf.text(pdfSafe(k.v), x + 3.5, y + 6.5);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...PDF.GRIS);
    pdf.splitTextToSize(pdfSafe(k.l), kw - 5).slice(0, 2).forEach((l, j) => pdf.text(l, x + 3.5, y + 10.5 + j * 2.8));
  });
  y += 22;

  // Graphique
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(68, 68, 68);
  pdf.text(pdfSafe(chartTitle()), PDF.M, y);
  y += 3;
  const img = await renderChartImage(fiche);
  const iw = PDF.W - 2 * PDF.M, ih = iw * img.ratio;
  pdf.addImage(img.dataUrl, 'JPEG', PDF.M, y, iw, ih, undefined, 'FAST');
  y += ih + 7;

  // Tableau annuel
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(68, 68, 68);
  pdf.text(pdfSafe('Dépenses CP par année'), PDF.M, y);
  y += 4;
  const noPoids = poidsLabel(entity);
  const moisTxt = MOIS_COURT[t.moisRef - 1].toLowerCase();
  const cols = [
    { h: ['Année'], w: 15, a: 'left' }, { h: ['Mois', 'disponibles'], w: 27, a: 'right' },
    { h: ['Dépenses CP'], w: 28, a: 'right' }, { h: ['Évol.', 'vs N-1'], w: 20, a: 'right' },
    { h: ['Cumul', `jan.-${moisTxt}`], w: 28, a: 'right' }, { h: ['Évol.', 'même pér.'], w: 22, a: 'right' },
    { h: ['Poids dép. locales', '(hors Immo, T6)'], w: 42, a: 'right' }
  ];
  const tw = cols.reduce((s, c) => s + c.w, 0);
  const cellX = (i) => { let x = PDF.M; for (let k = 0; k < i; k++) x += cols[k].w; return cols[i].a === 'right' ? x + cols[i].w - 2 : x + 2; };

  pdf.setFillColor(245, 246, 248); pdf.rect(PDF.M, y, tw, 9, 'F');
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7); pdf.setTextColor(68, 68, 68);
  cols.forEach((c, i) => c.h.forEach((h, j) => pdf.text(pdfSafe(h), cellX(i), y + 3.8 + j * 3.2, { align: c.a })));
  y += 9;

  const drawRow = (cells, opts = {}) => {
    pdf.setFont('helvetica', opts.bold ? 'bold' : (opts.italic ? 'italic' : 'normal'));
    pdf.setFontSize(7.8);
    cells.forEach((v, i) => {
      const col = opts.colors && opts.colors[i];
      pdf.setTextColor(...(col || opts.color || [26, 26, 26]));
      pdf.text(pdfSafe(v), cellX(i), y + 4.5, { align: cols[i].a });
    });
    pdf.setDrawColor(230, 232, 236); pdf.line(PDF.M, y + 6.4, PDF.M + tw, y + 6.4);
    y += 6.4;
  };
  const evolColor = v => (v == null || !isFinite(v) || v === 0) ? null : (v > 0 ? PDF.ROUGE : PDF.VERT);
  const poidsTxt = r => noPoids ? '—' : (r.poids == null ? '—' : `${fmtPoids(r.poids)} (${fmtEuroK(r.local)})`);

  t.rows.forEach(r => {
    if (!r.hasData) { drawRow([String(r.annee), '—', '—', '—', '—', '—', '—'], { color: [150, 150, 150] }); return; }
    const periode = r.complete ? '12 / 12' : `${r.nbMois} / 12 (${MOIS_COURT[r.nbMois - 1].toLowerCase()}.)`;
    const isLast = r.annee === t.last;
    drawRow([String(r.annee), periode, fmtEuro(r.total), fmtEvol(r.evolAnnuelle), fmtEuro(r.cumulRef), fmtEvol(r.evolPeriode), poidsTxt(r)], {
      bold: isLast, color: isLast ? PDF.BLEU : null,
      colors: [null, null, null, evolColor(r.evolAnnuelle), null, evolColor(r.evolPeriode), null]
    });
  });
  drawRow([`Total ${ANNEES[0]}-${ANNEES[ANNEES.length - 1]}`, '', fmtEuro(t.totalPeriode), '', '', '', noPoids ? '—' : fmtPoids(t.poidsPeriode)], { italic: true, color: [68, 68, 68] });
  if (t.moyenne != null) drawRow(['Moy. années compl.', '', fmtEuro(t.moyenne), '', '', '', ''], { italic: true, color: [68, 68, 68] });

  y += 4;
  pdfParagraph(pdf, buildNote(entity, t, posteKey), y);
}

/** Page(s) de synthèse d'un poste : une ligne par structure, dépenses annuelles 2022-2026 + poids. */
function pdfDrawSynthese(pdf, entities, posteKey) {
  const P = POSTES[posteKey];
  pdfHeader(pdf, `${P.titre} — synthèse par structure`, `Dépenses CP ${ANNEES[0]}-${ANNEES[ANNEES.length - 1]} (année en cours : cumul au dernier mois disponible)`);
  const cols = [{ h: 'Structure', w: 34, a: 'left' }, ...ANNEES.map(a => ({ h: String(a), w: 21, a: 'right' })), { h: 'Évol. même pér.', w: 22, a: 'right' }, { h: 'Poids local', w: 21, a: 'right' }];
  const cellX = i => { let x = PDF.M; for (let k = 0; k < i; k++) x += cols[k].w; return cols[i].a === 'right' ? x + cols[i].w - 2 : x + 2; };
  const tw = cols.reduce((s, c) => s + c.w, 0);
  let y = 31;

  const header = () => {
    pdf.setFillColor(245, 246, 248); pdf.rect(PDF.M, y, tw, 7, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.3); pdf.setTextColor(68, 68, 68);
    cols.forEach((c, i) => pdf.text(pdfSafe(c.h), cellX(i), y + 4.7, { align: c.a }));
    y += 7;
  };
  header();

  entities.forEach(e => {
    if (y > PDF.H - 22) { pdf.addPage(); y = 14; header(); }
    const { table: t } = computeFiche(e, posteKey);
    const last = t.hasData ? t.rows.find(r => r.annee === t.last) : null;
    const cells = [e.sigle, ...ANNEES.map(a => {
      const r = t.hasData ? t.rows.find(x => x.annee === a) : null;
      if (!r || !r.hasData) return '—';
      return fmtEuroK(r.total) + (r.complete ? '' : '*');
    }), last ? fmtEvol(last.evolPeriode) : '—', (last && !poidsLabel(e)) ? fmtPoids(last.poids) : '—'];
    const isNat = e.typeLabel === 'NAT';
    if (isNat) { pdf.setFillColor(238, 243, 251); pdf.rect(PDF.M, y, tw, 6.2, 'F'); }
    pdf.setFont('helvetica', isNat ? 'bold' : 'normal'); pdf.setFontSize(7.3);
    cells.forEach((v, i) => {
      let col = isNat ? PDF.BLEU : [26, 26, 26];
      if (i === cells.length - 2 && last && last.evolPeriode) col = last.evolPeriode > 0 ? PDF.ROUGE : PDF.VERT;
      pdf.setTextColor(...col);
      pdf.text(pdfSafe(v), cellX(i), y + 4.4, { align: cols[i].a });
    });
    pdf.setDrawColor(230, 232, 236); pdf.line(PDF.M, y + 6.2, PDF.M + tw, y + 6.2);
    y += 6.2;
  });

  y += 4;
  pdfParagraph(pdf, '* année incomplète (cumul au dernier mois disponible). « Évol. même pér. » : année la plus récente vs N-1 sur la même période. « Poids local » : part du poste dans les dépenses CP locales hors Immobilier et hors T6 Buralistes, année la plus récente (non applicable au DG). Les lignes nationales comptent chaque structure une seule fois.', y);
}

function newPDF() {
  const { jsPDF } = window.jspdf;
  return new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
}

function checkLibs() {
  if (typeof window.jspdf === 'undefined') { alert('Bibliothèque jsPDF non chargée. Rechargez la page.'); return false; }
  return true;
}

const postesDisponibles = () => POSTE_ORDER.filter(k => POSTE_DISPO[k]);

/** PDF de la structure affichée : poste sélectionné, ou une page par poste. */
async function exportPDFStructure(allPostes) {
  if (!checkLibs()) return;
  const e = ENTITIES.find(x => x.key === currentKey);
  if (!e) { alert('Aucune structure sélectionnée.'); return; }
  const btn = document.getElementById(allPostes ? 'btn-pdf-one-all' : 'btn-pdf-one');
  btn.disabled = true;
  try {
    const postes = allPostes ? postesDisponibles() : [currentPoste];
    const pdf = newPDF();
    for (let i = 0; i < postes.length; i++) {
      if (i > 0) pdf.addPage();
      await pdfDrawFiche(pdf, e, postes[i]);
    }
    pdfFooters(pdf);
    const suffix = allPostes ? 'postes' : safeName(POSTES[currentPoste].label);
    pdf.save(`depenses-CP-${suffix}-${safeName(e.sigle)}-${pdfTimestamp()}.pdf`);
  } catch (err) {
    console.error(err); alert('Erreur lors de la génération du PDF : ' + err.message);
  } finally { btn.disabled = false; }
}

async function exportPDFGroupe() {
  if (!checkLibs()) return;
  const allPostes = document.querySelector('input[name="export-postes"]:checked')?.value === 'all';
  const postes = allPostes ? postesDisponibles() : [currentPoste];
  const types = [...document.querySelectorAll('.type-cb:checked')].map(cb => cb.value);
  const withNat = document.getElementById('cb-national').checked;
  const withNatHorsDg = document.getElementById('cb-national-hors-dg').checked;
  const withSynth = document.getElementById('cb-synthese').checked;
  const skipEmpty = document.getElementById('cb-skip-empty').checked;

  const base = ENTITIES.filter(e =>
    (e.key === 'national' && withNat) || (e.key === 'national_hors_dg' && withNatHorsDg) || types.includes(e.typeLabel));
  // Liste filtrée par poste (une structure sans dépense sur un poste est ignorée pour ce poste seulement)
  const plan = postes.map(p => ({ poste: p, list: skipEmpty ? base.filter(e => computeFiche(e, p).table.hasData) : base }))
                     .filter(x => x.list.length);
  const nbFiches = plan.reduce((s, x) => s + x.list.length, 0);
  if (!nbFiches) { alert('Aucune structure à exporter avec ces filtres.'); return; }

  const btn = document.getElementById('btn-pdf-all');
  const prog = document.getElementById('pdf-progress');
  btn.disabled = true;
  try {
    const pdf = newPDF();
    let first = true, done = 0;
    const nextPage = () => { if (!first) pdf.addPage(); first = false; };
    for (const { poste, list } of plan) {
      if (withSynth) { nextPage(); pdfDrawSynthese(pdf, list, poste); }
      for (const e of list) {
        done++;
        prog.textContent = `${POSTES[poste].label} — fiche ${done} / ${nbFiches} (${e.sigle})`;
        nextPage();
        await pdfDrawFiche(pdf, e, poste);
        await new Promise(r => setTimeout(r, 0)); // laisse respirer l'UI
      }
    }
    pdfFooters(pdf);
    const suffix = allPostes ? 'postes' : safeName(POSTES[currentPoste].label);
    pdf.save(`depenses-CP-${suffix}-structures-${pdfTimestamp()}.pdf`);
    prog.textContent = `✓ ${nbFiches} fiche${nbFiches > 1 ? 's' : ''} exportée${nbFiches > 1 ? 's' : ''}`;
  } catch (err) {
    console.error(err); prog.textContent = '';
    alert('Erreur lors de la génération du PDF : ' + err.message);
  } finally { btn.disabled = false; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
function prepareData(structures, bm, immo) {
  STATE_structures = structures;
  STATE_bm = bm;
  STATE_immo = immo;
  FICHE_CACHE.clear();
  SIEGE_IDS = new Set(structures.id.filter((id, i) => structures.Type?.[i] === 'Siège' || structures.Type_Affichage?.[i] === 'DG'));
  LOCAL_MODE = COLS_LOCAL_CUMUL.every(c => bm[c]) ? 'cumul' : (COLS_LOCAL_MOIS.every(c => bm[c]) ? 'mois' : null);
  if (!LOCAL_MODE) console.warn('[depenses-cp] colonnes locales absentes de Budget_Mensuel : poids non calculé');
  POSTE_DISPO = {};
  POSTE_ORDER.forEach(k => { POSTE_DISPO[k] = !!bm[POSTES[k].col]; });
  POSTE_ORDER.filter(k => !POSTE_DISPO[k]).forEach(k => console.warn(`[depenses-cp] colonne ${POSTES[k].col} absente : poste "${POSTES[k].label}" désactivé`));
  if (!POSTE_DISPO[currentPoste]) currentPoste = postesDisponibles()[0];
  buildSkipRows();
  ENTITIES = buildEntities();
}

async function init() {
  try {
    grist.ready({ requiredAccess: 'read table' });
    Chart.defaults.font.family = FONT_CANVAS;

    const [structures, bm, immo] = await Promise.all([
      grist.docApi.fetchTable('Structures').catch(() => null),
      grist.docApi.fetchTable('Budget_Mensuel').catch(() => null),
      grist.docApi.fetchTable('Immobilier').catch(() => null)  // facultatif : ligne cible du poste Loyer
    ]);
    if (!structures) throw new Error('Table Structures non accessible.');
    if (!bm || !bm.id) throw new Error('Table Budget_Mensuel non accessible.');
    if (!POSTE_ORDER.some(k => bm[POSTES[k].col])) throw new Error('Aucune des colonnes attendues (Cumul_CP_vehicules, Conso_Formation_CP, Conso_Missions_CP, Conso_Loyer_CP, Conso_Contx_CP) n\'est présente dans Budget_Mensuel.');

    prepareData(structures, bm, immo);
    renderPosteBar();
    document.getElementById('loading').style.display = 'none';

    // Si l'utilisateur n'a accès qu'à une structure (ACL), on ouvre directement sa fiche
    const structs = ENTITIES.filter(e => e.typeLabel !== 'NAT');
    selectEntity(structs.length === 1 ? structs[0].key : ENTITIES[0].key);

    // Suivi de la ligne sélectionnée quand le widget est lié à la table Structures
    grist.onRecord(rec => {
      if (!rec) return;
      const sigle = (rec.Sigle || '').trim();
      const ent = ENTITIES.find(e => e.key === String(rec.id))
        || (sigle ? ENTITIES.find(e => e.sigle === sigle) : null)
        || (rec.Type_Affichage === 'DG' ? ENTITIES.find(e => e.key === 'DG') : null);
      if (ent && ent.key !== currentKey) selectEntity(ent.key);
    });
  } catch (err) {
    console.error(err);
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.style.display = '';
    el.textContent = '⚠️ ' + err.message;
  }
}

if (typeof grist !== 'undefined') init();
